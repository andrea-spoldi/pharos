apiVersion: pharos.io/v1alpha1
kind: Platform
metadata:
  name: acme-platform
  title: ACME Developer Portal
spec:
  support: { type: github, repo: https://github.com/acme/platform }
  inputs:
    team:
      type: enum
      from: catalog/teams/
      field: metadata.name
      required: true
      label: Your team
  secrets:
    - name: GITLAB_TOKEN
      description: Personal access token (read_api)
