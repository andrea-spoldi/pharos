apiVersion: cockpit.dev/v1alpha1
kind: Widget
metadata:
  name: service-catalog
  title: Service Catalog
  version: 0.1.0
spec:
  source:
    type: file
    path: ../../catalog/services/
    glob: "*.yaml"
  refresh: 5m
  view:
    type: table
    columns:
      - { field: metadata.name, label: Service }
      - { field: spec.owner, label: Owner }
      - { field: spec.tier, label: Tier }
      - { field: spec.repo, label: Repo }
      - { field: _source, label: Source }
