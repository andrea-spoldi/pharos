[package]
name = "pharos"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pharos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
pharos-engine = { workspace = true, features = ["specta"] }
pharos-manifest = { workspace = true, features = ["specta"] }
tauri = { version = "2.12", features = [] }
serde.workspace = true
specta.workspace = true
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

[lints]
workspace = true
