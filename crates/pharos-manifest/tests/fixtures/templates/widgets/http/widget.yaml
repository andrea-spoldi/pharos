apiVersion: pharos.io/v1alpha1
kind: Widget
metadata: { name: http }
spec:
  inputs:
    project: { type: string }
  source:
    type: http
    url: "https://gitlab.acme/{{ inputs.project }}/{{ inputs.nope }}?t={{ secrets.MISSING }}"
    headers:
      Authorization: "Bearer {{ secrets.TOKEN }}"
      X-Team: "{{ user.nope }}"
      X-Env: "{{ env.stage }}"
      X-Bad: "{{ foo.bar }}"
      X-Open: "{{ user.team"
  view: { type: raw }
