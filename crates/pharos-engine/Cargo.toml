[package]
name = "pharos-engine"
version = "0.1.0"
description = "Source sync, local state and widget execution (no Tauri dependency)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pharos-manifest.workspace = true
globset = "0.4"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
specta = { workspace = true, optional = true }
thiserror = "2"
keyring = "4"
# Blocking like the rest of the engine; OS trust store so internal CAs work.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }

[features]
# Derives `specta::Type` for the Tauri bindings; off for the CLI.
specta = ["dep:specta", "pharos-manifest/specta"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
