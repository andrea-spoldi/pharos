[package]
name = "cockpit-manifest"
version = "0.1.0"
description = "Platform repo kinds, validation and permission derivation (no Tauri dependency)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
globset = "0.4"
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
specta = { workspace = true, optional = true }
thiserror = "2"
url = "2.5"

[features]
# Derives `specta::Type` for the Tauri bindings; off for the CLI.
specta = ["dep:specta"]

[dev-dependencies]
insta = { version = "1.49", features = ["json"] }
tempfile = "3"

[lints]
workspace = true
