[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
pharos-engine = { path = "crates/pharos-engine" }
pharos-manifest = { path = "crates/pharos-manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned with tauri-specta (D-008).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
