    <text x="98" y="310" font-size="25" font-weight="500" fill="#e9ebf0">A lighthouse for your platform.</text>
    <text x="98" y="344" font-size="17" fill="#99a1af">A local developer portal. Git is the control plane — no server, no SaaS.</text>
  </g>
