<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Pharos — a lighthouse for your platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1016"/><stop offset="1" stop-color="#141824"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#6b8cff" stop-opacity=".22"/><stop offset="1" stop-color="#6b8cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#6b8cff" stop-opacity=".10"/><stop offset="1" stop-color="#6b8cff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0a1020" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <!-- the beam sweeping across the banner -->
  <path d="M168 172 L1280 -40 L1280 150 Z" fill="url(#ray)"/>
  <circle cx="168" cy="172" r="150" fill="url(#glow)"/>
